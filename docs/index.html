<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiny Dublin: isometric pixel-art map of Dublin</title>
  <script src="https://cdn.jsdelivr.net/npm/openseadragon@6.1.1/build/openseadragon/openseadragon.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #e3e9ef; font: 14px system-ui, sans-serif; color: #eee; }
    #map { position: absolute; inset: 0; }
    #panel { position: absolute; top: 12px; left: 12px; z-index: 10; background: rgba(16, 21, 29, .88);
             padding: 10px 12px; border-radius: 8px; width: 270px; }
    #panel h1 { font-size: 16px; margin: 0 0 6px; }
    #q { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; border: 1px solid #456; background: #0b0f15; color: #eee; }
    #results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
    #results li { padding: 4px 6px; cursor: pointer; border-radius: 4px; }
    #results li:hover, #results li.sel { background: #2a3a4f; }
    #results small { color: #9ab; }
    #credit { position: absolute; bottom: 6px; right: 10px; z-index: 10; font-size: 11px; color: #dde; background: rgba(16, 21, 29, .7);
               padding: 3px 8px; border-radius: 6px; max-width: calc(100% - 40px); }
    #clouds { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1>Tiny Dublin</h1>
    <input id="q" placeholder="Find a place: Lucan, Howth, Dublin Airport…" autocomplete="off" />
    <ul id="results"></ul>
  </div>
  <div id="credit">Imagery derived from Google Photorealistic 3D Tiles, Map data ©2026 Google · Places © OpenStreetMap contributors ·
    Style: tiny.london LoRA (Qwen Research License, non-commercial) · Method after tiny.london and isometric.nyc</div>
  <script>
    const CLOUDS = fetch("clouds.json").then((r) => r.json());
    const IMG_W = 124928, IMG_H = 83968, MAX_LEVEL = 17;
    let HULL = null; // convex outline of the map (image px), for skipping empty tiles

    // Does tile (level, x, y) overlap the map? Separating-axis test against the convex hull.
    function tileHitsMap(level, x, y) {
      const sc = 2 ** (MAX_LEVEL - level), cols = Math.ceil(Math.ceil(IMG_W / sc) / 512), rows = Math.ceil(Math.ceil(IMG_H / sc) / 512);
      if (x < 0 || y < 0 || x >= cols || y >= rows) return false;
      if (!HULL) return true;
      const x0 = x * 512 * sc, y0 = y * 512 * sc, x1 = x0 + 512 * sc, y1 = y0 + 512 * sc;
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const [px, py] of HULL) { minX = Math.min(minX, px); maxX = Math.max(maxX, px); minY = Math.min(minY, py); maxY = Math.max(maxY, py); }
      if (x1 < minX || x0 > maxX || y1 < minY || y0 > maxY) return false;
      const corners = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
      for (let i = 0; i < HULL.length - 1; i++) {
        const [ax, ay] = HULL[i], [bx, by] = HULL[i + 1], nx = by - ay, ny = ax - bx;
        let hmin = Infinity, hmax = -Infinity, rmin = Infinity, rmax = -Infinity;
        for (const [px, py] of HULL) { const d = px * nx + py * ny; hmin = Math.min(hmin, d); hmax = Math.max(hmax, d); }
        for (const [px, py] of corners) { const d = px * nx + py * ny; rmin = Math.min(rmin, d); rmax = Math.max(rmax, d); }
        if (rmax < hmin || rmin > hmax) return false;
      }
      return true;
    }

    const viewer = OpenSeadragon({
      id: "map",
      prefixUrl: "https://cdn.jsdelivr.net/npm/openseadragon@6.1.1/build/openseadragon/images/",
      drawer: "canvas",
      showNavigationControl: false,
      showNavigator: false,
      // As tiny.london: never zoom past 1:1, so every pixel is a drawn pixel.
      maxZoomPixelRatio: 1,
      minZoomImageRatio: 0.9,
      visibilityRatio: 0.5,
      constrainDuringPan: false,
      animationTime: 0.15,
      blendTime: 0.1,
      maxTilesPerFrame: 16,
      imageLoaderLimit: 16,
      immediateRender: false,
      smoothTileEdgesMinZoom: 1,
      placeholderFillStyle: "#e3e9ef",
      gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true },
      gestureSettingsTouch: { clickToZoom: false, dblClickToZoom: true, pinchToZoom: true },
    });

    // ---- clouds round the map -------------------------------------------
    const cloudCanvas = document.createElement("canvas");
    cloudCanvas.id = "clouds";
    viewer.element.appendChild(cloudCanvas);
    const cctx = cloudCanvas.getContext("2d");
    const DECK = "#e3e9ef", SHADE = "#ccd6e1", WHITE = "#ffffff", INK = "#8293a8";
    let clouds = null, polyPath = null;
    CLOUDS.then((C) => {
      HULL = C.hull;
      // Open the map only now, so no tile outside the outline is ever requested.
      viewer.open({
        width: IMG_W, height: IMG_H, tileSize: 512, tileOverlap: 0, minLevel: 0, maxLevel: MAX_LEVEL,
        getTileUrl: (level, x, y) => `tiles/map_files/${level}/${x}_${y}.webp`,
        tileExists: tileHitsMap,
      });
      polyPath = new Path2D();
      C.poly.forEach(([x, y], i) => (i ? polyPath.lineTo(x, y) : polyPath.moveTo(x, y)));
      polyPath.closePath();
      clouds = C.clouds.map((c) => {
        const [x, y, kind, ext] = c, body = new Path2D(), light = new Path2D();
        for (let i = 4; i < c.length; i += 3) {
          const dx = c[i], dy = c[i + 1], r = c[i + 2];
          body.moveTo(dx + r, dy); body.arc(dx, dy, r, 0, 2 * Math.PI);
          const hx = dx - 0.12 * r, hy = dy - 0.2 * r, hr = 0.75 * r;
          light.moveTo(hx + hr, hy); light.arc(hx, hy, hr, 0, 2 * Math.PI);
        }
        return { x, y, kind, ext, body, light };
      });
      drawClouds();
    });

    function drawClouds() {
      const item = viewer.world.getItemAt(0);
      if (!clouds || !item) return;
      const dpr = window.devicePixelRatio || 1;
      const cw = viewer.element.clientWidth, ch = viewer.element.clientHeight;
      if (cloudCanvas.width !== Math.round(cw * dpr) || cloudCanvas.height !== Math.round(ch * dpr)) {
        cloudCanvas.width = Math.round(cw * dpr); cloudCanvas.height = Math.round(ch * dpr);
      }
      const o = viewer.viewport.pixelFromPoint(item.imageToViewportCoordinates(0, 0, true), true);
      const p = viewer.viewport.pixelFromPoint(item.imageToViewportCoordinates(10000, 0, true), true);
      const s = (p.x - o.x) / 10000; // screen px per image px
      const vx0 = -o.x / s, vy0 = -o.y / s, vx1 = vx0 + cw / s, vy1 = vy0 + ch / s;
      const ctx = cctx;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, cloudCanvas.width, cloudCanvas.height);
      ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * o.x, dpr * o.y);
      // Cloud deck everywhere outside the map.
      const deck = new Path2D();
      deck.rect(vx0 - 10, vy0 - 10, vx1 - vx0 + 20, vy1 - vy0 + 20);
      deck.addPath(polyPath);
      ctx.fillStyle = DECK;
      ctx.fill(deck, "evenodd");
      // Soft shadows of the edge clouds on the map.
      ctx.save();
      ctx.clip(polyPath);
      ctx.fillStyle = "rgba(15, 25, 40, 0.2)";
      for (const c of clouds) {
        if (c.kind !== 0 || c.x + c.ext * 1.4 < vx0 || c.x - c.ext > vx1 || c.y + c.ext * 1.4 < vy0 || c.y - c.ext > vy1) continue;
        ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * (o.x + (c.x + 0.12 * c.ext) * s), dpr * (o.y + (c.y + 0.3 * c.ext) * s));
        ctx.fill(c.body);
      }
      ctx.restore();
      // The clouds: ink outline, shaded body, lit tops.
      ctx.strokeStyle = INK;
      for (const c of clouds) {
        if (c.x + c.ext < vx0 || c.x - c.ext > vx1 || c.y + c.ext < vy0 || c.y - c.ext > vy1) continue;
        const sr = c.ext * s;
        if (sr < 1) continue;
        ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * (o.x + c.x * s), dpr * (o.y + c.y * s));
        if (sr > 4) { ctx.lineWidth = 2.2 / s; ctx.stroke(c.body); }
        ctx.fillStyle = SHADE; ctx.fill(c.body);
        if (sr > 2) { ctx.fillStyle = WHITE; ctx.fill(c.light); }
      }
    }
    viewer.addHandler("update-viewport", drawClouds);
    viewer.addHandler("resize", drawClouds);

    // Sharp pixels at full detail, smooth when the map is shown smaller.
    let smooth = null;
    function updateSmoothing() {
      const img = viewer.viewport.viewportToImageZoom(viewer.viewport.getZoom(true));
      const want = img < 0.999;
      if (want !== smooth) { smooth = want; viewer.drawer.setImageSmoothingEnabled(want); }
    }
    viewer.addHandler("animation", updateSmoothing);
    viewer.addHandler("open", updateSmoothing);
    let W = 1;
    let lastHash = "";
    function fromHash(immediate) {
      if (location.hash === lastHash) return;
      const p = new URLSearchParams(location.hash.slice(1));
      if (p.has("x")) goTo(+p.get("x"), +p.get("y"), +p.get("z") || 1, immediate);
    }
    viewer.addHandler("open", () => {
      W = viewer.world.getItemAt(0).getContentSize().x;
      if (location.hash.includes("x=")) fromHash(true);
      else goTo(63488, 45032, 0.12, true); // O'Connell Bridge
      updateSmoothing();
    });
    window.addEventListener("hashchange", () => fromHash(false));
    function goTo(x, y, zoomPx, immediate) {
      const pt = new OpenSeadragon.Point(x / W, y / W);
      viewer.viewport.panTo(pt, immediate);
      // zoomPx: screen px per image px
      const z = viewer.viewport.imageToViewportZoom(zoomPx);
      viewer.viewport.zoomTo(z, pt, immediate);
    }
    viewer.addHandler("animation-finish", () => {
      const c = viewer.viewport.getCenter();
      const z = viewer.viewport.viewportToImageZoom(viewer.viewport.getZoom());
      lastHash = `#x=${Math.round(c.x * W)}&y=${Math.round(c.y * W)}&z=${z.toFixed(3)}`;
      history.replaceState(null, "", lastHash);
    });

    let places = [];
    fetch("places.json").then((r) => r.json()).then((p) => (places = p));
    const q = document.getElementById("q"), ul = document.getElementById("results");
    const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    let shown = [], sel = -1;
    function render() {
      ul.innerHTML = "";
      shown.forEach((p, i) => {
        const li = document.createElement("li");
        li.innerHTML = `${p.name} <small>${p.kind}</small>`;
        if (i === sel) li.className = "sel";
        li.onmousedown = (e) => { e.preventDefault(); pick(p); };
        ul.appendChild(li);
      });
    }
    function pick(p) { goTo(p.x, p.y, p.zoom || 0.5, false); ul.innerHTML = ""; q.value = p.name; q.blur(); }
    q.addEventListener("input", () => {
      const s = norm(q.value.trim());
      sel = -1;
      if (!s) { shown = []; return render(); }
      shown = places.filter((p) => norm(p.name).includes(s))
        .sort((a, b) => (norm(a.name).startsWith(s) ? 0 : 1) - (norm(b.name).startsWith(s) ? 0 : 1) || a.rank - b.rank)
        .slice(0, 12);
      render();
    });
    q.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { sel = Math.min(sel + 1, shown.length - 1); render(); e.preventDefault(); }
      if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); render(); e.preventDefault(); }
      if (e.key === "Enter" && shown.length) pick(shown[Math.max(sel, 0)]);
    });
  </script>
</body>
</html>
