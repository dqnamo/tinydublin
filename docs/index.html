<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiny Dublin: isometric pixel-art map of Dublin</title>
  <script src="https://cdn.jsdelivr.net/npm/openseadragon@6.1.1/build/openseadragon/openseadragon.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #10151d; font: 14px system-ui, sans-serif; color: #eee; }
    #map { position: absolute; inset: 0; }
    #panel { position: absolute; top: 12px; left: 12px; z-index: 10; background: rgba(16, 21, 29, .88);
             padding: 10px 12px; border-radius: 8px; width: 270px; }
    #panel h1 { font-size: 16px; margin: 0 0 6px; }
    #q { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; border: 1px solid #456; background: #0b0f15; color: #eee; }
    #results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
    #results li { padding: 4px 6px; cursor: pointer; border-radius: 4px; }
    #results li:hover, #results li.sel { background: #2a3a4f; }
    #results small { color: #9ab; }
    #credit { position: absolute; bottom: 6px; right: 10px; z-index: 10; font-size: 11px; opacity: .8; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1>Tiny Dublin</h1>
    <input id="q" placeholder="Find a place: Lucan, Howth, Dublin Airport…" autocomplete="off" />
    <ul id="results"></ul>
  </div>
  <div id="credit">Imagery derived from Google Photorealistic 3D Tiles, Map data ©2026 Google · Places © OpenStreetMap contributors ·
    Style: tiny.london LoRA (Qwen Research License, non-commercial) · Method after tiny.london and isometric.nyc</div>
  <script>
    const viewer = OpenSeadragon({
      id: "map",
      prefixUrl: "https://cdn.jsdelivr.net/npm/openseadragon@6.1.1/build/openseadragon/images/",
      tileSources: "tiles/map.dzi",
      showNavigator: true,
      navigatorPosition: "BOTTOM_LEFT",
      maxZoomPixelRatio: 3,
      minZoomImageRatio: 0.5,
      visibilityRatio: 0.5,
      imageLoaderLimit: 16,
      immediateRender: false,
    });
    let W = 1;
    let lastHash = "";
    function fromHash(immediate) {
      if (location.hash === lastHash) return;
      const p = new URLSearchParams(location.hash.slice(1));
      if (p.has("x")) goTo(+p.get("x"), +p.get("y"), +p.get("z") || 1, immediate);
    }
    viewer.addHandler("open", () => {
      W = viewer.world.getItemAt(0).getContentSize().x;
      if (location.hash.includes("x=")) fromHash(true);
      else goTo(63488, 45032, 0.12, true); // O'Connell Bridge
    });
    window.addEventListener("hashchange", () => fromHash(false));
    function goTo(x, y, zoomPx, immediate) {
      const pt = new OpenSeadragon.Point(x / W, y / W);
      viewer.viewport.panTo(pt, immediate);
      // zoomPx: screen px per image px
      const z = viewer.viewport.imageToViewportZoom(zoomPx);
      viewer.viewport.zoomTo(z, pt, immediate);
    }
    viewer.addHandler("animation-finish", () => {
      const c = viewer.viewport.getCenter();
      const z = viewer.viewport.viewportToImageZoom(viewer.viewport.getZoom());
      lastHash = `#x=${Math.round(c.x * W)}&y=${Math.round(c.y * W)}&z=${z.toFixed(3)}`;
      history.replaceState(null, "", lastHash);
    });

    let places = [];
    fetch("places.json").then((r) => r.json()).then((p) => (places = p));
    const q = document.getElementById("q"), ul = document.getElementById("results");
    const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    let shown = [], sel = -1;
    function render() {
      ul.innerHTML = "";
      shown.forEach((p, i) => {
        const li = document.createElement("li");
        li.innerHTML = `${p.name} <small>${p.kind}</small>`;
        if (i === sel) li.className = "sel";
        li.onmousedown = (e) => { e.preventDefault(); pick(p); };
        ul.appendChild(li);
      });
    }
    function pick(p) { goTo(p.x, p.y, p.zoom || 0.5, false); ul.innerHTML = ""; q.value = p.name; q.blur(); }
    q.addEventListener("input", () => {
      const s = norm(q.value.trim());
      sel = -1;
      if (!s) { shown = []; return render(); }
      shown = places.filter((p) => norm(p.name).includes(s))
        .sort((a, b) => (norm(a.name).startsWith(s) ? 0 : 1) - (norm(b.name).startsWith(s) ? 0 : 1) || a.rank - b.rank)
        .slice(0, 12);
      render();
    });
    q.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { sel = Math.min(sel + 1, shown.length - 1); render(); e.preventDefault(); }
      if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); render(); e.preventDefault(); }
      if (e.key === "Enter" && shown.length) pick(shown[Math.max(sel, 0)]);
    });
  </script>
</body>
</html>
